# Builds the ScanFit server image (the server and the worker it starts share one
# image) and publishes it to the GitHub Container Registry when a version tag
# such as v1.0.0 is pushed. Users can then set SCANFIT_IMAGE instead of building.
# Actions are pinned to full commit SHAs (the comment gives the release).
name: Release image

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the server image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read # check out the tagged source
      packages: write # push ghcr.io/<owner>/scanfit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scanfit
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # The image downloads the SAM 2.1 weights while it builds (pinned revision,
      # SHA-256 checked) and sets ORT_DISABLE_TELEMETRY=1 for ONNX Runtime.
      # No build cache: every release is built from scratch.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
